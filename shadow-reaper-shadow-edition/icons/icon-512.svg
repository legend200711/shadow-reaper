<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0d1626"/>
      <stop offset="100%" stop-color="#080c14"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e90ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1e90ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="113" fill="url(#bg)"/>

  <!-- Glow halo -->
  <circle cx="256" cy="256" r="200.6" fill="url(#glow)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="193.51999999999998" fill="none" stroke="#1e90ff" stroke-width="6.144" stroke-opacity="0.55"/>

  <!-- Skull ☠ -->
  <text
    x="256" y="329.9328"
    text-anchor="middle"
    font-size="194.56"
    font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif"
    fill="#e8edf5"
  >&#9760;</text>

  <!-- Word-mark below skull -->
  <text
    x="256" y="450.56"
    text-anchor="middle"
    font-size="44"
    font-family="-apple-system, Segoe UI, system-ui, sans-serif"
    font-weight="700"
    fill="#1e90ff"
    letter-spacing="5"
    opacity="0.9"
  >SR</text>
</svg>
# Shadow Reaper Cloud API — Wrangler Configuration
# Worker: cloud-api (cloud data synchronization)
#
# Deploy with:
#   npx wrangler deploy --config cloudflare/wrangler-cloud.toml
#
# Local dev:
#   npx wrangler dev --config cloudflare/wrangler-cloud.toml
#
# ⚠️  NEVER commit real secrets to this file.
# ⚠️  Set secrets via: wrangler secret put SECRET_NAME
#
# Required secrets (set before deploying):
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT   ← paste full service account JSON
#   wrangler secret put FIREBASE_PROJECT_ID        ← already set to: ffr3r3223
#   wrangler secret put SR_ALLOWED_ORIGINS         ← set to: ["https://legend200711.github.io"]

name       = "sr-cloud-api"
account_id = "f276c4406b82d3c1e35efed1ef486235"

main             = "worker/cloud-api.js"
compatibility_date = "2025-07-04"

[observability]
enabled = true

[observability.traces]
enabled = true

[vars]
SR_PROJECT = "shadow-reaper-standalone"
SR_ENV     = "production"

# Development override — uncomment for local dev only:
# SR_ENV = "development"

# ── Workers AI — Hosted Shadow Inference ──────────────────────────────────────
# Enables /api/v1/inference to run hosted model inference via Workers AI.
# This is the remote execution backend for ShadowReaper — NOT a separate AI.
# Uncomment and deploy to enable hosted inference:
#
#   npx wrangler deploy --config cloudflare/wrangler-cloud.toml
#
# Once the AI binding is bound, health endpoint returns inference:true and
# SRInferenceRuntime will use hosted inference when local WebGPU/CPU fails.
#
# To enable:
#   1. Uncomment the [ai] block below
#   2. Deploy: npx wrangler deploy --config cloudflare/wrangler-cloud.toml
#   3. Verify: npm run cloud:health   (look for "inference":true)
#
# Optional: override model via secret
#   wrangler secret put SR_INFERENCE_MODEL   ← e.g. @cf/meta/llama-3-8b-instruct

[ai]
binding = "AI"

# Optional: pin a specific inference model (default: @cf/meta/llama-3-8b-instruct)
# Set via: wrangler secret put SR_INFERENCE_MODEL

# ── Secrets (set via CLI — NEVER put values in this file) ─────────────────────
# wrangler secret put FIREBASE_SERVICE_ACCOUNT
# wrangler secret put FIREBASE_PROJECT_ID
# wrangler secret put SR_ALLOWED_ORIGINS

# ── Optional: KV for rate limiting state persistence across isolates ───────────
# (Uncomment after creating namespace)
# [[kv_namespaces]]
# binding = "SR_RATE_LIMIT_KV"
# id      = "YOUR_KV_NAMESPACE_ID"   # PLACEHOLDER

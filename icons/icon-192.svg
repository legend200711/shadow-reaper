<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0d1626"/>
      <stop offset="100%" stop-color="#080c14"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e90ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1e90ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- Glow halo -->
  <circle cx="96" cy="96" r="74.8" fill="url(#glow)"/>

  <!-- Outer ring -->
  <circle cx="96" cy="96" r="72.16" fill="none" stroke="#1e90ff" stroke-width="2.3040000000000003" stroke-opacity="0.55"/>

  <!-- Skull ☠ -->
  <text
    x="96" y="123.7248"
    text-anchor="middle"
    font-size="72.96000000000001"
    font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif"
    fill="#e8edf5"
  >&#9760;</text>

  <!-- Word-mark below skull -->
  <text
    x="96" y="168.96"
    text-anchor="middle"
    font-size="16"
    font-family="-apple-system, Segoe UI, system-ui, sans-serif"
    font-weight="700"
    fill="#1e90ff"
    letter-spacing="2"
    opacity="0.9"
  >SR</text>
</svg>